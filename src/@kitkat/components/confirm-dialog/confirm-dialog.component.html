<div class="dialog-content-wrapper">
    <mat-toolbar class="mat-primary">
        <mat-toolbar-row class="flex flex-row justify-between RTM-button-color">
            <span class="title text-xl">{{data?.title}}</span>
            <button mat-icon-button aria-label="Close dialog" (click)="dialogRef.close()">
                <mat-icon class="RTM-button-color">close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>

    <div mat-dialog-content class="h-full">
        <h3 class="text-center mt-6 mb-6">
            {{data?.message}}
        </h3>
        <div mat-dialog-actions class="flex flex-row justify-center gap-3">
            <button mat-stroked-button class=" w-3/2 rounded-sm" aria-label="No" (click)="dialogRef.close(false)"
                style="border-radius: 5px !important; width: 15% !important;">
                No
            </button>

            <button class="optimus-button save-button RTM-button-color" mat-flat-button color="primary" aria-label="YES"
                (click)="dialogRef.close(true)" style="border-radius:5px !important">
                Yes
            </button>
        </div>
    </div>


</div>
