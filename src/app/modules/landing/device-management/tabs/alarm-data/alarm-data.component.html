    <!-- Alarm data occurred -->
    <div class="w-full bg-card mt-8">
        <div class="fuse-card bg-white border border-gray-200 rounded-lg shadow">
            <div class="row">
                <h4 class="text-2xl font-semibold-bold text-center text-muted py-3 mt-4 mb-4">Alarm data occurred</h4>
            </div>

            <div class="flex flex-row">
                <div class="w-full flex-col mt-0 p-4">
                    <div class="flex">
                        <label class="form-label">Time Span:</label>
                    </div>
                    <div class="w-full flex flex-row mt-2">
                        <mat-form-field class="flex pl-3 gt-xs:pr-3 w-1/4">
                            <input class="searchbox flex" id="searchID" matInput
                                [matDatepicker]="picker" [(ngModel)]="this.currentTime"
                                [ngModelOptions]="{standalone: true}">
                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                        </mat-form-field>
                        <mat-form-field class="flex pl-3 gt-xs:pr-3 w-1/4">
                            <input class="searchbox flex" id="searchID" matInput
                                [matDatepicker]="picker2" [(ngModel)]="this.currentTime2"
                                [ngModelOptions]="{standalone: true}">
                            <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
                            <mat-datepicker #picker2></mat-datepicker>
                        </mat-form-field>

                        <div class="ml-6">
                            <button [color]="'primary'" mat-flat-button id="btnSearch" type="button"
                                class="kitkat-mat-button RTM-button-color Querybutton" (click)="getDeviceAlarmLogs()">
                                <mat-icon>search</mat-icon>
                                Query</button>
                        </div>

                    </div>
                </div>
            </div>
            <hr style="margin-top: 0px !important;">

            <table class="w-full table-responsive mat-card fuse-card bg-white border border-gray-200 rounded-lg shadow" mat-table [dataSource]="dataSourceAlarm" matSort>

                <!-- Toggle -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header style="width:7rem !important;" class="text-left header-text">

                        <div (change)="$event ? masterToggle() : null"
                            [checked]="selection.hasValue() && isAllSelected()"
                            [indeterminate]="selection.hasValue() && !isAllSelected()">
                            #
                        </div>

                    </th>
                    <td mat-cell *matCellDef="let row; let i =index">
                        <div (click)="$event.stopPropagation()"
                            (change)="$event ? selection.toggle(row) : null;isSomeSelected()"
                            [checked]="selection.isSelected(row)">
                            {{row?.id}}
                        </div>
                    </td>
                </ng-container>

                <!-- name -->
                <ng-container matColumnDef="temperature">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text" style="width:8rem !important">Temperature</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text ">
                            <p [ngClass]="{
                                'text-red-600': checkValue(item, 'temperature') === 'alarm',
                                'text-yellow-500':checkValue(item, 'temperature') === 'warning'
                              }">{{item?.temperature}}°C</p>
                        </div>
                    </td>
                </ng-container>

                <!-- alarm type -->
                <ng-container matColumnDef="humidity">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Humidity</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p [ngClass]="{
                                'text-red-600': checkValue(item, 'humidity') === 'alarm',
                                'text-yellow-500':checkValue(item, 'humidity') === 'warning'
                              }">{{item?.humidity}}%</p>
                        </div>
                    </td>
                    </ng-container>
                <!-- Object -->
                <ng-container matColumnDef="light">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Light</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p [ngClass]="{
                                'text-red-600': checkValue(item, 'light') === 'alarm',
                                'text-yellow-500':checkValue(item, 'light') === 'warning'
                              }">{{item?.light}}lux</p>
                        </div>
                    </td>
                    </ng-container>
                    <!-- Event -->
                <ng-container matColumnDef="vibration">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Vibration</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p [ngClass]="{
                                'text-red-600': checkValue(item, 'vibration') === 'alarm',
                                'text-yellow-500':checkValue(item, 'vibration') === 'warning'
                              }">{{item?.vibration}}mg</p>
                        </div>
                    </td>
                    </ng-container>
                <!-- effectiveTime -->
                <ng-container matColumnDef="battery">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Battery%</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p>{{item?.battery}}%</p>
                        </div>
                    </td>
                </ng-container>

                <!-- createTime -->
                <ng-container matColumnDef="rtctime">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Rtc</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p>{{item?.rtctime}}</p>
                        </div>
                    </td>
                </ng-container>

                <!-- Server time -->
                <ng-container matColumnDef="servertime">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Server Time</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p>{{item?.servertime}}</p>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="alarm">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left header-text">Alarm Information</th>
                    <td mat-cell *matCellDef="let item" class="tab-row text-left">
                        <div class="column-text">
                            <p>{{item?.alarm}}</p>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="alarmColumns"></tr>
                <tr mat-row *matRowDef="let row; let odd = odd; columns: alarmColumns;"></tr>
            </table>
            <div class="flex flex-row justify-end w-full">
                <mat-paginator class="mt-4 mb-4 mr-16" [pageSize]="20" [pageSizeOptions]="[20, 50, 100]"
                    [length]="totalRecords"></mat-paginator>
            </div>
        </div>
    </div>

</section>
