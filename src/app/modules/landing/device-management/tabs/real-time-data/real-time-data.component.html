    <div class="w-full p-3" *ngIf="realTimeData?.alarm || realTimeData?.terminal || realTimeData?.netstatus">
        <div class="shadow-xl dark:bg-card rounded-lg" style="box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1) !important;">
            <div class="p-4">
                <button type="button" class="details-toggle" (click)="toggleStateDetails()">
                    <span>{{ showStateDetails ? 'Hide device details' : 'Show device details' }}</span>
                    <span class="details-toggle-icon">{{ showStateDetails ? '−' : '+' }}</span>
                </button>

                <div class="device-state-details" *ngIf="showStateDetails">
                    <div class="detail-header">Device state details</div>
                    <div class="detail-list">
                        <div class="detail-line" *ngFor="let detail of stateDetails" [ngClass]="detail.status">
                            <div class="detail-icon" [ngClass]="detail.status">
                                <svg *ngIf="detail.icon === 'info'" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm.75 15.5h-1.5v-6h1.5v6Zm0-8.75h-1.5V7h1.5v1.75Z"/>
                                </svg>
                                <svg *ngIf="detail.icon === 'error'" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                    <path d="M11.001 10h2v5h-2zm0 7h2v2h-2z"/>
                                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
                                </svg>
                            </div>
                            <div class="detail-content">
                                <div class="detail-title">{{ detail.label }}</div>
                                <div class="detail-value">{{ detail.value }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
