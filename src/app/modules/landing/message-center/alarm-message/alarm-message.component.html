<section class="w-full h-full ">
    <div class="w-full flex justify-between">
  
      <!-- Breadcrum and heading Section -->
      <div class="flex flex-wrap items-center font-medium">
        <div class="pr-4" style="border-right: 1px solid">
          <a class="text-2xl whitespace-nowrap">Alarm Message</a>
        </div>
        <div class="flex items-center ml-1 whitespace-nowrap">
          <div class="pl-3">
            <mat-icon class="icon-size-4 text-secondary" [svgIcon]="'heroicons_solid:home'"></mat-icon>
          </div>
          <div class="pl-0" style="display: flex; align-items: center;">
            <mat-icon class="icon-size-10 text-secondary" [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
            <span><a class="text-lg ml-1 text-primary-500">Alarm Message</a></span>
          </div>
  
        </div>
      </div>
  
    </div>
  
    <!-- alarm message listing listing -->
    <div class="w-full bg-card">
  
      <div class="flex flex-row"> 
        <div class="w-full flex-col mt-3 p-4">
            <div class="w-full flex flex-row mt-2">
                <form [formGroup]="searchForm" class="flex flex-row">
                    <mat-form-field class="flex pl-3 gt-xs:pr-3 w-auto">
                        <input class="flex" matInput [matDatepicker]="picker" [(ngModel)]="this.currentTime"
                        formControlName="startTime">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                    <mat-form-field class="flex pl-3 gt-xs:pr-3 w-auto">
                        <input class="flex" matInput [matDatepicker]="picker2" [(ngModel)]="this.currentTime2"
                        formControlName="endTime">
                        <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
                        <mat-datepicker #picker2></mat-datepicker>
                    </mat-form-field>
                    <div class="flex flex-col mt-0 ml-2" style="margin-top: -20px !important;">
                        <div class="flex">
                            <label class="form-label">Keywords:</label>
                        </div>
                        <mat-form-field>
                            <input formControlName="keyWord" class="flex-shrink" matInput type="search"
                                placeholder="">
                        </mat-form-field>

                    </div>
                    <div class="flex">
                        <div class="ml-2 justify-end items-end">
                            <button (click)="getAllQueries()" [color]="'primary'" mat-flat-button id="btnSearch"
                                type="button" class="kitkat-mat-button RTM-button-color Querybutton">
                                Query</button>
                        </div>
                    </div>
                </form> 
            </div> 
     
         
        </div>

      </div>
      <hr style="margin-top: 0px !important;">
  
      <table class="w-full table-responsive mat-card" mat-table [dataSource]="dataSource">
          
          <!-- id -->
          
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef style="width:7rem !important;" class="text-left header-text">
              <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()"
                [indeterminate]="selection.hasValue() && !isAllSelected()">
                <p class="header-text">No</p>
              </mat-checkbox>
    
            </th>
            <td mat-cell *matCellDef="let row; let i=index">
              <mat-checkbox (click)="$event.stopPropagation()"
                (change)="$event ? selection.toggle(row) : null;isSomeSelected()" [checked]="selection.isSelected(row)">
                {{i+1}}
              </mat-checkbox>
            </td>
          </ng-container>
     
    
          <!-- Theme-->
          <ng-container matColumnDef="device">
            <th mat-header-cell *matHeaderCellDef class="text-left header-text">Theme</th>
            <td mat-cell *matCellDef="let item" class="tab-row text-left">
              <div class="column-text">
                <p>{{item?.device}}</p>
              </div>
            </td>
          </ng-container>
    
          <!-- Content -->
          <ng-container matColumnDef="message">
            <th mat-header-cell *matHeaderCellDef class="text-left header-text">Content</th>
            <td mat-cell *matCellDef="let item" class="tab-row text-left">
              <div class="column-text">
                <p>{{item?.message}}</p>
              </div>
            </td>
          </ng-container>
    
          <!-- Time -->
          <ng-container matColumnDef="time">
            <th mat-header-cell *matHeaderCellDef class="text-left header-text">Time</th>
            <td mat-cell *matCellDef="let item" class="tab-row text-left">
              <div class="column-text">
                <p>{{item?.time}}</p>
              </div>
            </td>
          </ng-container>
 
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; let odd = odd; columns: displayedColumns;"></tr>
      </table>
      <div class="flex flex-row justify-end w-full">
        <mat-paginator class="mt-4 mb-4 mr-16" 
          [pageSize]="50" [pageSizeOptions]="[50, 100, 200]"
          [length]="totalRecords"
          (page)="onPageChange($event)"
          ></mat-paginator>
      </div>
  
    </div>
  
  </section>
