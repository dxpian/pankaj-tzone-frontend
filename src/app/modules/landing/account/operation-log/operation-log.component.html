<section class="w-full h-full ">
    <div class="w-full flex justify-between">

        <!-- Breadcrum and heading Section -->
        <div class="flex flex-wrap items-center font-medium">
            <div class="pr-4" style="border-right: 1px solid">
                <a class="text-2xl whitespace-nowrap">User Management</a>
            </div>
            <div class="flex items-center ml-1 whitespace-nowrap">
                <div class="pl-3">
                    <mat-icon class="icon-size-4 text-secondary" [svgIcon]="'heroicons_solid:home'"></mat-icon>
                </div>
                <div class="pl-0" style="display: flex; align-items: center;">
                    <mat-icon class="icon-size-10 text-secondary"
                        [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                    <span><a class="text-lg ml-1 text-primary-500">Account</a></span>
                </div>
                <div class="pl-0" style="display: flex; align-items: center;">
                    <mat-icon class="icon-size-10 text-secondary"
                        [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                    <span><a class="text-lg ml-1 text-primary-500">Operation Log</a></span>
                </div>

            </div>
        </div>

    </div>

    <!-- log  listing -->
    <div class="w-full bg-card mt-2">
        <div class="flex flex-row">
            <div class="w-full flex-col mt-0 p-4">
                <div class="flex">
                    <label class="form-label">Time Span:</label>
                </div>
                <div class="w-full flex flex-row mt-2 align-items-center">
                    <mat-form-field class="flex pl-3 gt-xs:pr-3 w-1/4">
                        <input class="searchbox flex" id="searchID" matInput
                            [matDatepicker]="picker" [(ngModel)]="this.currentTime"
                            [ngModelOptions]="{standalone: true}">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                    <mat-form-field class="flex pl-3 gt-xs:pr-3 w-1/4">
                        <input class="searchbox flex" id="searchID" matInput
                            [matDatepicker]="picker2" [(ngModel)]="this.currentTime2"
                            [ngModelOptions]="{standalone: true}">
                        <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
                        <mat-datepicker #picker2></mat-datepicker>
                    </mat-form-field>

                    <div class="w-full flex flex-row ml-6">
                        <input class="searchbox2 flex-shrink" id="searchID" matInput type="search"
                        [formControl]="searchInputControl"
                        placeholder="Device Name / Serial ID">
                    </div>

                    <div class="ml-6">
                        <button [color]="'primary'" mat-flat-button id="btnSearch" type="button"
                            class="kitkat-mat-button RTM-button-color Querybutton"
                            (click) = "getOperationLog()"
                        >
                            <mat-icon>search</mat-icon>
                            Query
                        </button>
                    </div>

                </div>
            </div>
        </div>
        <hr style="margin-top: 0px !important;">

        <table class="w-full table-responsive mat-card" mat-table [dataSource]="dataSource">

            <!-- id -->

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef style="width:7rem !important;" class="text-left header-text">
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
                        <p class="header-text">No</p>
                    </mat-checkbox>

                </th>
                <td mat-cell *matCellDef="let row; let i=index">
                    <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null;isSomeSelected()"
                        [checked]="selection.isSelected(row)">
                        {{i+1}}
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef class="text-left header-text" style="width:8rem !important">
                  Operation  type
                </th>
                <td mat-cell *matCellDef="let item" class="tab-row text-left">
                    <div class="column-text">
                        <p>{{item?.type}}</p>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="content">
                <th mat-header-cell *matHeaderCellDef class="text-left header-text">Content</th>
                <td mat-cell *matCellDef="let item" class="tab-row text-left">
                    <div class="column-text">
                        <p style="white-space: normal; word-break: break-word; overflow-wrap: anywhere;">{{item?.content}}</p>
                    </div>
                </td>
            </ng-container>

            <!-- time -->
            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef class="text-left header-text">Time</th>
                <td mat-cell *matCellDef="let item" class="tab-row text-left">
                    <div class="column-text">
                        <p>{{item?.time}}</p>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; let odd = odd; columns: displayedColumns;"></tr>
        </table>
        <div class="flex flex-row justify-end w-full">
            <mat-paginator class="mt-4 mb-4 mr-16"
                [pageSize]="50" [pageSizeOptions]="[20, 50, 100, 200]"
                [length]="_pageQuery.total"
                (page)="onPageChange($event)"
                >
            </mat-paginator>
        </div>

    </div>

</section>
