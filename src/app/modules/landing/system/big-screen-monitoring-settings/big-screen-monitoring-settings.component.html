<section class="w-full">
    <div class="w-full flex justify-between mb-4">

        <!-- Breadcrum and heading Section -->
        <div class="flex flex-wrap items-center font-medium">
            <div class="pr-4" style="border-right: 1px solid">
                <a class="text-2xl whitespace-nowrap">Big screen monitoring settings</a>
            </div>
            <div class="flex items-center ml-1 whitespace-nowrap">
                <div class="pl-3">
                    <mat-icon class="icon-size-4 text-secondary" [svgIcon]="'heroicons_solid:home'"></mat-icon>
                </div>
                <div class="pl-0" style="display: flex; align-items: center;">
                    <mat-icon class="icon-size-10 text-secondary"
                        [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                    <span><a class="text-lg ml-1 text-primary-500">Big screen monitoring settings</a></span>
                </div>

            </div>
        </div>

    </div>
    <section class="flex w-full">
        <div class="bg-card shadow-lg flex flex-col w-1/5 p-4">
            <div class="font-normal">
                Selected Device 
            </div>
            <hr class="p-0 m-0 mt-3">
            <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
                <!-- This is the tree node template for leaf nodes -->
                <!-- There is inline padding applied to this node using styles.
                  This padding value depends on the mat-icon-button width. -->
                <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
                   <!-- <span [ngClass]="{ 'w-4 h-4 mr-3 rounded-full bg-black': getDeviceStatus(node?.id) == 0, 'w-4 h-4 mr-3 rounded-full bg-green-500': getDeviceStatus(node?.id) == 1 }"
                    *ngIf="getDeviceStatus(node?.id)"></span>  -->
                    <button mat-flat-button class="cursor-pointer mr-3" *ngIf="node?.id != undefined" style="margin-left: -40px !important;" (click)="selectADevice(node.id)">
                        {{node.name}}
                    </button>
                    <div *ngIf="node?.id === undefined" style="left: -10px !important;">
                        <div class="mat-tree-node">
                            <button mat-icon-button matTreeNodeToggle>
                                <mat-icon class="mat-icon-rtl-mirror">
                                    'chevron_right'
                                </mat-icon>
                            </button>
                            {{node?.name}} 
                        </div> 
                    </div>
                </mat-tree-node>
                <!-- This is the tree node template for expandable nodes -->
                <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                    <div class="mat-tree-node">
                        <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
                            <mat-icon class="mat-icon-rtl-mirror">
                                {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                            </mat-icon>
                        </button>
                        {{node?.name}}
                        
                    </div>
                    <!-- There is inline padding applied to this div using styles.
                        This padding value depends on the mat-icon-button width.  -->
                    <div [class.example-tree-invisible]="!treeControl.isExpanded(node)" role="group">
                        <ng-container matTreeNodeOutlet></ng-container>
                    </div>
                </mat-nested-tree-node>
            </mat-tree>
        </div>
        <div class="flex flex-col bg-card shadow-lg w-4/5 p-4 ml-5 h-fit">
           <div class="font-normal">
               Selected Device {{this.selectedDevices?.length}}
           </div>
           <hr class="p-0 m-0 mt-3">

        <div class="flex flex-row flex-wrap mb-5" >
            <div class="bg-card shadow-lg flex flex-row justify-between p-4 w-1/3 mt-5 cursor-pointer" *ngFor="let item of this.selectedDevices">
                <p class="cursor-pointer">{{item?.name}}</p>
                <mat-icon class="cursor-pointer" svgIcon="mat_solid:cancel" (click)="deleteSelected(item?.id)"></mat-icon>
            </div>
        </div>
        <div class="font-normal">
            Choose a template
        </div>
        <hr class="p-0 m-0 mt-3">
         <div class="flex bg-card w-2/5 p-4 rounded-sm shadow-lg mt-2">
            <div class="p-0">
                <img src="assets/images/device/template-0.jpg" width="50" height="50">
            </div>
             
         </div>
        </div>
    </section>

</section>
