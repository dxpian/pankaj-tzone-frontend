<section class="w-full">
    <div class="w-full flex justify-between mb-4">

        <!-- Breadcrum and heading Section -->
        <div class="flex flex-wrap items-center font-medium">
            <div class="pr-4" style="border-right: 1px solid">
                <a class="text-2xl whitespace-nowrap">Site</a>
            </div>
            <div class="flex items-center ml-1 whitespace-nowrap">
                <div class="pl-3">
                    <mat-icon class="icon-size-4 text-secondary" [svgIcon]="'heroicons_solid:home'"></mat-icon>
                </div>
                <div class="pl-0" style="display: flex; align-items: center;">
                    <mat-icon class="icon-size-10 text-secondary"
                        [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                    <span>
                        <mat-icon class="icon-size-4 text-secondary" [svgIcon]="'heroicons_solid:globe-alt'"></mat-icon>
                        <a class="text-lg ml-1 text-primary-500">Personalized</a></span>
                    <mat-icon class="icon-size-10 text-secondary"
                        [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon> <span>Domain</span>
                </div>

            </div>
        </div>

    </div>
    <div class="flex flex-col bg-card justify-center mr-auto ml-auto w-4/5">
        <form class="flex flex-row w-full mt-0 pl-8 pr-8 pt-8 pb-4  overflow-hidden" [formGroup]="domainForm">
            <div class="w-full flex flex-col gt-xs:flex-row pr-3 borderLine">
                <div class="flex flex-col mb-5">
                    <h4 class="text-lg mb-1 font-medium">Default URL</h4>
                    <h4 class="font-bold mb-1 text-2xl mt-0">icebattery.cloud.tzonedigital.cn</h4> 
                </div>
                <div class="flex flex-row w-full justify-between">
                    <mat-form-field class="gt-xs:pr-3 w-full">
                        <mat-label>Custom Domain:</mat-label>
                        <input matInput formControlName="customdomain">
    
                    </mat-form-field>
                    <mat-form-field class="ml-3 gt-xs:pl-3 w-full">
                        <mat-label>Type:</mat-label>
                        <input matInput formControlName="type">
    
                    </mat-form-field>
                    <mat-form-field class="ml-3 gt-xs:pl-3 w-full">
                        <mat-label>Value</mat-label>
                        <input matInput formControlName="value">
                    </mat-form-field>
                </div>
             
                <div class="flex flex-row justify-start pr-8 mb-4"> 
                    <button mat-raised-button (click)="saveSettings()" class="RTM-button-color p-4 border-radius-button" type="submit"
                       color="primary">Save Settings</button>
                  </div>

                  <kitkat-alert [type]="'primary'" [appearance]="'border'" class="mt-4">  
                    Note: After the domain name binding is submitted, you need to contact the administrator to open it to take effect!.                
                </kitkat-alert>
                
            </div> 
        </form> 
    </div>
</section>
