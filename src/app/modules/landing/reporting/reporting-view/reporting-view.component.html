<section class="w-full">
    <div class="flex flex-row p-8 pb-4">
        <img src="assets/images/logo/logo.png" style="width: 100px">
    </div>
    <hr>
     <div class="pl-12 pr-12 pb-2">
        <p>Device Id : {{this.serialId}}</p>
     </div>
    <div class="flex flex-row flex-wrap p-12 pt-4">
        <!-- Temperature -->

                            <p class="mb-0 text-secondary text-lg">Temperature</p>

                            <p class="mb-0 font-13 text-success"></p>

        </div>

    </div>

    <hr style="margin-top: 0px !important;"> 
        <div class="flex-auto -mt-px pt-4 sm:pt-6">
        <div class="w-full max-w-screen-xl mx-auto">
            <!-- Tabs -->
            <mat-tab-group
                class="sm:px-2"
                mat-stretch-tabs="false"
                [animationDuration]="'0'"> 
                <!-- chart -->
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span class="inline-flex items-center space-x-2">
                            <mat-icon svgIcon="heroicons_outline:presentation-chart-line"></mat-icon> 
                            <span class="">Chart</span> 
                        </span>
                    </ng-template>
                    <ng-template matTabContent>
                        <app-chart [dataProps]="dataForChart"></app-chart>
                        <app-map></app-map>
                    </ng-template>
                  
                </mat-tab>
                <!-- List -->
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span class="inline-flex items-center space-x-2">
                            <mat-icon>grid_on</mat-icon>
                            <span class="">List</span>
                           
                        </span>
                    </ng-template>
                    <ng-template matTabContent>
                       <app-list></app-list>
                    </ng-template>
                  
                </mat-tab>
 

            </mat-tab-group>
        </div>
    </div>
</section>
